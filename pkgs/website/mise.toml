# Tasks ########################################################################


# Dev ==========================================================================

# dev ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[tasks.dev]
run = "pnpm exec astro dev --host 0.0.0.0"
depends = ["gen/types", "//pkgs/wasm.crate:build:dev"]


# Typecheck ====================================================================

# typecheck ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[tasks."typecheck"]
run = "pnpm exec tsc --noEmit --runExternalCode"

# typecheck:watch ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[tasks."typecheck:watch"]
run = "pnpm exec tsc --noEmit --watch --runExternalCode"


# Build ========================================================================

# build ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[tasks.build]
run = "pnpm exec astro build"
depends = ["gen/types", "//pkgs/wasm.crate:build"]


# Deploy =======================================================================

# deploy ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[tasks.deploy]
run = "fnox exec -- pnpm exec wrangler deploy"
depends = "build"


# Generate =====================================================================

# gen/types ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[tasks."gen/types"]
run = "pnpm exec wrangler types"
sources = ["wrangler.toml"]
outputs = ["worker-configuration.d.ts"]
