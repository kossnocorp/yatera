name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  qa:
    name: Run QA
    uses: ./.github/workflows/qa.yml

  build:
    name: Build Binaries
    uses: ./.github/workflows/build.yml
    with:
      artifact_suffix: ${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    needs:
      - qa
      - build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Dev Env
        uses: ./.github/actions/setup

      - name: Download Build Artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: "tera-${{ github.ref_name }}-*"
          path: downloaded-artifacts

      - name: Collect Release Assets
        shell: bash
        run: |
          shopt -s nullglob
          artifact_dirs=(downloaded-artifacts/*)
          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "No release artifacts were downloaded for ${{ github.ref_name }}" >&2
            exit 1
          fi

          mkdir -p release-assets
          for artifact_dir in "${artifact_dirs[@]}"; do
            artifact_name="$(basename "$artifact_dir")"
            for file in "$artifact_dir"/*; do
              [ -f "$file" ] || continue
              cp "$file" "release-assets/$artifact_name"
            done
          done

      - name: Attest Release Assets
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$(git-cliff --latest --strip all --tag-pattern '^v\d+\.\d+\.\d+')"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --notes "$notes" --verify-tag
          fi

      - name: Upload Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            release-assets/* \
            "${{ steps.attest.outputs.bundle-path }}" \
            --clobber

      - name: Display Stats
        if: always()
        uses: ./.github/actions/stats

  publish:
    name: Publish Crates
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      MISE_ENV_RELEASE: "true"

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set Up Dev Env
        uses: ./.github/actions/setup

      - name: Clean Up Git State
        shell: bash
        run: |
          git add .
          git stash

      - name: Publish Crates
        run: mise publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Display Stats
        if: always()
        uses: ./.github/actions/stats
